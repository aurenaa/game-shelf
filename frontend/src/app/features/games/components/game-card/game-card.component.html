<div class="game-card">
    <img [src]="game.imageUrl" [alt]="game.title"/>
    <div class="game-info">
        <h3> {{ game.title }} </h3>
        <p class="genre"> {{ game.genre }} </p>

        @if (game.metricriticScore) {
            <p class="rating"> {{ game.metricriticScore }}/100 </p>
        }
    </div>
</div>
