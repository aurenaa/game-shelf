<div class="game-card">
  <img [src]="game.background_image" [alt]="game.name" />
  <div class="game-info">
    <h3>{{ game.name }}</h3>
    
    @if (game.genres && game.genres.length > 0) {
      <p class="genre">
        @for (genre of game.genres; track genre.name) {
          {{ genre.name }}@if (!$last) {, }
        }
      </p>
    }
    
    @if (game.metacritic) {
      <p class="rating">⭐ {{ game.metacritic }}/100</p>
    }
  </div>
</div>
